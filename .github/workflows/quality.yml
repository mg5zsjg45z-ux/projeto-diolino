name: Diolino quality
on:
  pull_request:
  push:
    branches: [main, development/2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify OCR assets
        shell: pwsh
        run: |
          foreach ($p in @('assets/ocr/tesseract.exe','assets/ocr/tessdata/por.traineddata','assets/ocr/tessdata/eng.traineddata')) {
            if (!(Test-Path -LiteralPath $p)) { throw "Missing OCR asset: $p" }
          }
      - name: Prepare isolated Windows installer test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-output | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Inno Setup 6 is required on the Windows test runner.'
          }
          "DIOLINO_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Unit and integration tests
        run: |
          python -m coverage run --branch --source=. --omit="tests/*,*/site-packages/*,test-output/*,online/site/*,desktop-v3/*" -m unittest discover -s tests -v
      - name: Coverage reports
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-windows
          path: coverage.xml
          if-no-files-found: warn
  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m venv .audit-env
      - run: .audit-env/Scripts/python.exe -m pip install "pip-audit>=2.9,<3" "cyclonedx-bom>=6,<8"
      - name: Inventory runtime and build environment
        run: .audit-env/Scripts/cyclonedx-py.exe environment (Get-Command python).Source --output-format JSON --output-file sbom.json
      - name: Audit runtime and build dependencies
        run: .audit-env/Scripts/pip-audit.exe -r requirements-build.txt --format json --output audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: |
            sbom.json
            audit.json
          if-no-files-found: warn
  website-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: online/site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: Copy-Item hosting.local.example.json hosting.local.json
      - run: npm ci --no-audit --no-fund
      - name: Full dependency audit report (including development tools)
        shell: pwsh
        run: |
          npm audit --json *> npm-audit-full.json
          $auditExitCode = $LASTEXITCODE
          $audit = Get-Content npm-audit-full.json -Raw | ConvertFrom-Json
          $v = $audit.metadata.vulnerabilities
          Write-Host "Full audit: $($v.total) total ($($v.moderate) moderate, $($v.high) high, $($v.critical) critical)."
          if ($v.high -gt 0 -or $v.critical -gt 0) { throw 'High or critical dependency advisory found; see npm-audit-full.json.' }
          if ($auditExitCode -gt 1) { throw "npm audit failed unexpectedly with exit code $auditExitCode." }
          exit 0
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - run: npm run test:http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-dependency-audit
          path: online/site/npm-audit-full.json
          if-no-files-found: warn
  static-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install "bandit>=1.8,<2"
      - name: Bandit high severity gate
        run: python -m bandit -r . -x ./tests,./test-output,./.venv,./assets -f json -o bandit.json --exit-zero
      - name: Enforce high severity gate
        run: python -m bandit -r . -x ./tests,./test-output,./.venv,./assets -lll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-security
          path: bandit.json
          if-no-files-found: warn
